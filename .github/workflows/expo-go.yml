name: Validar abertura no Expo Go
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo install --check
        continue-on-error: true
      - name: Preparar Expo Go e Metro
        run: |
          curl --fail --location 'https://github.com/expo/expo-go-releases/releases/download/Expo-Go-58.0.5/Expo-Go-58.0.5.apk' -o "$RUNNER_TEMP/expo.apk"
          CI=1 npx expo start --go --localhost > "$RUNNER_TEMP/metro.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/metro.pid"
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash scripts/testar-expo-go.sh
